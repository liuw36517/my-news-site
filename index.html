<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的发布中心</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="glass-card">

<h1>
我的发布中心
</h1>

<p>
新闻 · 文章 · 资源
</p>

</div>

</header>



<section class="content">


<div class="glass-card">

<h2>
🔥 最新动态
</h2>

<p>
欢迎来到我的个人发布网站
</p>

</div>



<!-- 自动显示发布文章 -->

<div id="posts"></div>



<div class="glass-card">

<a href="resources/index.html">
进入资源 →
</a>


</div>



</section>





<footer class="glass-bar">


<a href="index.html">

🏠

<span>
首页
</span>

</a>



<a href="posts/post1.html">

📰

<span>
文章
</span>

</a>



<a href="publish/index.html">

📢

<span>
发布
</span>

</a>



<a href="resources/index.html">

<span>
资源
</span>

</a>



<a href="admin/index.html">

🔐

<span>

</span>

</a>



</footer>





<script>


let post = JSON.parse(

localStorage.getItem("post")

);



if(post){


document.getElementById("posts").innerHTML =


`

<div class="glass-card">


<h2>

${post.title}

</h2>


<p>

${post.content}

</p>


<a href="posts/post1.html">

阅读全文 →

</a>


</div>


`;


}


</script>
