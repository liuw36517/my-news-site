<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的发布中心</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="glass-card">

<h1>
我的发布中心
</h1>

<p>
新闻 · 资源 · 分享
</p>

</div>

</header>



<section class="news">


<div class="glass-card">

<h2>
🔥 最新动态
</h2>

<p>
网站正式上线
</p>

</div>



<!-- 自动显示文章 -->

<div id="posts"></div>



<div class="glass-card">

<h2>
📦 资源中心
</h2>

<p>
软件、教程、资料
</p>

<a href="resources/index.html">
进入资源 →
</a>

</div>



</section>





<!-- 底部导航 -->

<footer class="glass-bar">


<a href="index.html">

🏠

<span>
首页
</span>

</a>



<a href="publish/index.html">

📢

<span>
发布
</span>

</a>



<a href="resources/index.html">

📦

<span>
资源
</span>

</a>



<a href="admin/index.html">

🔐

<span>
后台
</span>

</a>


</footer>





<script>


let post = JSON.parse(

localStorage.getItem("post")

);



if(post){


document.getElementById("posts").innerHTML =


`

<div class="glass-card">


<h2>

${post.title}

</h2>



<p>

${post.content}

</p>



<a href="posts/post1.html">

阅读文章 →

</a>


</div>


`;


}



</script>



</body>

</html>
