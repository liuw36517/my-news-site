<!DOCTYPE html>
<html>

<head>
<title>发布后台</title>
</head>

<body>


<h1>🔐 发布后台</h1>


<input placeholder="文章标题">


<textarea placeholder="输入内容"></textarea>


<button onclick="publish()">
发布
</button>


<script>

function publish(){

let title = document.querySelector("input").value;
let content = document.querySelector("textarea").value;


if(title==""){
    alert("请输入标题");
    return;
}

let post = {
title:title,
content:content
};

localStorage.setItem(
"post",
JSON.stringify(post)
);

alert("文章保存成功");

} 







</body>

</html>
