<!DOCTYPE html>
<html>

<head>
<title>发布后台</title>
</head>

<body>


<h1>🔐 发布后台</h1>


<input placeholder="文章标题">


<textarea placeholder="输入内容"></textarea>


<button onclick="publish()">
发布
</button>


<script>

function publish(){

let title = document.querySelector("input").value;
let content = document.querySelector("textarea").value;


if(title==""){
    alert("请输入标题");
    return;
}


let page = `
<!DOCTYPE html>
<html>

<head>
<title>${title}</title>
<link rel="stylesheet" href="../style.css">
</head>


<body>

<div class="glass-card">

<h1>${title}</h1>

<p>${content}</p>

</div>

</body>

</html>
`;


alert("文章创建成功");

}

</script>


</body>

</html>
